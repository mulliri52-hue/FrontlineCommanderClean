name: Frontline Commander - Crea APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Crea APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Installa Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa SDK Android 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;35.0.0"

          echo "Android SDK 36 installato."

      - name: Trova FRONTLINE_READY.zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          while IFS= read -r file; do
            ZIP_FILE="$file"
            break
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name "FRONTLINE_READY.zip" \
              -print
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRORE: FRONTLINE_READY.zip non trovato."
            echo
            echo "File presenti nel repository:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -print | sort
            exit 1
          fi

          echo "ZIP trovato:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Estrai progetto Android
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Estrazione completata."

      - name: Trova progetto Gradle
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=""

          while IFS= read -r file; do
            SETTINGS_FILE="$file"
            break
          done < <(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \
              -print
          )

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRORE: progetto Gradle non trovato."
            echo
            echo "Struttura estratta:"
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 6 \
              -type f \
              -print | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "Progetto Gradle:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Controlla progetto
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle.kts" \
            || test -f "$PROJECT_DIR/settings.gradle"

          test -f "$PROJECT_DIR/build.gradle.kts" \
            || test -f "$PROJECT_DIR/build.gradle"

          test -f "$PROJECT_DIR/app/build.gradle.kts" \
            || test -f "$PROJECT_DIR/app/build.gradle"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Struttura progetto OK."

      - name: Correggi configurazione Android
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERRORE: app/build.gradle.kts non trovato."
            exit 1
          fi

          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path("$PROJECT_DIR/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          # compileSdk 35 -> 36
          text = re.sub(
              r'compileSdk\s*=\s*35\b',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'compileSdk\s+35\b',
              'compileSdk 36',
              text
          )

          # Java 8/11 -> Java 17
          text = re.sub(
              r'JavaVersion\.VERSION_1_8',
              'JavaVersion.VERSION_17',
              text
          )

          text = re.sub(
              r'JavaVersion\.VERSION_11',
              'JavaVersion.VERSION_17',
              text
          )

          # Rimuove vecchio kotlinOptions con jvmTarget String.
          text = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # Rimuove eventuali righe vecchie jvmTarget = "17".
          text = re.sub(
              r'^\s*jvmTarget\s*=\s*["\']17["\']\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # Aggiunge il nuovo compilerOptions DSL.
          if 'JvmTarget.JVM_17' not in text:
              text += '''

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          '''

          path.write_text(text, encoding="utf-8")
          PY

          echo "Configurazione Android corretta."

      - name: Allinea versioni AGP e Kotlin
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import re
          from pathlib import Path

          root = Path("$PROJECT_DIR")

          files = list(root.rglob("*.gradle.kts"))
          files += list(root.rglob("*.gradle"))
          files += list(root.rglob("*.toml"))

          for path in files:
              text = path.read_text(encoding="utf-8")

              # Android Gradle Plugin 8.13.2
              text = re.sub(
                  r'(com\.android\.application["\']?\s*\)?\s*version\s*["\'])[^"\']+(["\'])',
                  r'\g<1>8.13.2\2',
                  text
              )

              text = re.sub(
                  r'(com\.android\.library["\']?\s*\)?\s*version\s*["\'])[^"\']+(["\'])',
                  r'\g<1>8.13.2\2',
                  text
              )

              # Kotlin 2.3.21.
              text = re.sub(
                  r'(org\.jetbrains\.kotlin\.android["\']?\s*\)?\s*version\s*["\'])[^"\']+(["\'])',
                  r'\g<1>2.3.21\2',
                  text
              )

              text = re.sub(
                  r'(org\.jetbrains\.kotlin\.plugin\.serialization["\']?\s*\)?\s*version\s*["\'])[^"\']+(["\'])',
                  r'\g<1>2.3.21\2',
                  text
              )

              text = re.sub(
                  r'(kotlin\s*\s*["\']android["\']\s*\s*version\s*["\'])[^"\']+(["\'])',
                  r'\g<1>2.3.21\2',
                  text
              )

              text = re.sub(
                  r'(kotlin\s*\s*["\']jvm["\']\s*\s*version\s*["\'])[^"\']+(["\'])',
                  r'\g<1>2.3.21\2',
                  text
              )

              path.write_text(text, encoding="utf-8")

          print("Versioni AGP/Kotlin controllate.")
          print("AGP: 8.13.2")
          print("Kotlin: 2.3.21")
          PY

      - name: Controlla Kotlin JVM Target
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if ! grep -q "JvmTarget.JVM_17" "$APP_GRADLE"; then
            echo "ERRORE: JVM Target 17 non configurato."
            exit 1
          fi

          if grep -qE 'jvmTarget[[:space:]]*=[[:space:]]*["'\'']17
