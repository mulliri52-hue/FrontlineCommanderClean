name: APK completo

on:
  workflow_dispatch:
  push:
    branches:
      - principale
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v5

      - name: Installa Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Estrai il progetto Android
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          ZIP_FILE=$(find . -maxdepth 2 -type f -name 'FrontlineCommander_Fixed.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRORE: FrontlineCommander_Fixed.zip non trovato."
            echo "File presenti nel repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP trovato: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d android-project

          echo "Contenuto estratto:"
          find android-project -maxdepth 5 -type f | sort | head -200

      - name: Trova il progetto Gradle
        shell: bash
        run: |
          set -e

          GRADLEW=$(find android-project -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERRORE: gradlew non trovato."
            echo "Struttura del progetto estratto:"
            find android-project -maxdepth 6 -print | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "gradlew trovato in: $GRADLEW"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configura Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "Progetto Gradle:"
          pwd

          echo "Contenuto:"
          ls -la

      - name: Compila APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --stacktrace

      - name: Trova APK generato
        shell: bash
        run: |
          set -e

          echo "APK generati:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRORE: nessun APK generato."
            exit 1
          fi

          echo "APK trovato: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: FrontlineCommander-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
