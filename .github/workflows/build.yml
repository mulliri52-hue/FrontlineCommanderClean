name: Crea APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Crea APK Android
    runs-on: ubuntu-latest

    steps:

      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Installa Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Prepara Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;35.0.0"

          echo "Android SDK 36 OK."

      - name: Trova FRONTLINE_READY.zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name 'FRONTLINE_READY.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRORE: FRONTLINE_READY.zip non trovato."
            echo
            echo "File ZIP presenti:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name '*.zip' -print
            exit 1
          fi

          echo "ZIP trovato:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Estrai progetto Android
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          echo "Estrazione completata."

      - name: Trova progetto Gradle
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERRORE: settings.gradle(.kts) non trovato."

            echo
            echo "Contenuto estratto:"
            find "$PROJECT_DIR" -maxdepth 4 -type f -print

            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERRORE: app/build.gradle(.kts) non trovato."
            exit 1
          fi

          echo "Progetto Gradle trovato:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Controlla struttura progetto
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROGETTO"
          echo "======================================"

          echo "$PROJECT_DIR"

          echo
          echo "======================================"
          echo "FILE PRINCIPALI"
          echo "======================================"

          ls -la "$PROJECT_DIR"

          echo
          echo "======================================"
          echo "APP"
          echo "======================================"

          ls -la "$PROJECT_DIR/app"

      - name: Correggi compileSdk e Java
        shell: bash
        run: |
          set -e

          APP_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_FILE" ]; then
            echo "ERRORE: $APP_FILE non trovato."
            exit 1
          fi

          echo "Controllo configurazione Android..."

          sed -i 's/compileSdk[[:space:]]*=[[:space:]]*35/compileSdk = 36/g' "$APP_FILE"
          sed -i 's/compileSdk[[:space:]]*35/compileSdk 36/g' "$APP_FILE"

          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$APP_FILE"
          sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' "$APP_FILE"

          echo "compileSdk e Java controllati."

      - name: Controlla Kotlin JVM Target
        shell: bash
        run: |
          set -e

          APP_FILE="$PROJECT_DIR/app/build.gradle.kts"

          echo "Controllo JVM Target..."

          if grep -q 'jvmTarget[[:space:]]*=[[:space:]]*["'\'']17["'\'']' "$APP_FILE"; then
            echo "ATTENZIONE: vecchia sintassi jvmTarget trovata."
            sed -i '/jvmTarget[[:space:]]*=[
