name: Crea APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Crea APK Android
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: "8.11.1"
      ZIP_NAME: "FRONTLINE_READY.zip"

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}" \
              -type f \
              -name sdkmanager \
              -print \
              -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERRORE: sdkmanager non trovato."
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Trova FRONTLINE_READY.zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "$ZIP_NAME" \
            -print \
            -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRORE: $ZIP_NAME non trovato."

            echo "File disponibili nel repository:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type f \
              -print | sort

            exit 1
          fi

          echo "ZIP trovato:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV
