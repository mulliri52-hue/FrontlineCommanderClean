name: APK completo

on:
  workflow_dispatch:
  push:
    branches:
      - principale

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Estrai il progetto Android
        shell: bash
        run: |
          mkdir -p android-project
          unzip -q FrontlineCommander_FIXED.zip -d android-project

      - name: Trova il progetto Gradle
        shell: bash
        run: |
          GRADLEW=$(find android-project -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERRORE: gradlew non trovato nel progetto Android."
            echo "Contenuto estratto:"
            find android-project -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Progetto Gradle trovato in: $PROJECT_DIR"

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rendi eseguibile Gradle
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Compila APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Trova APK
        shell: bash
        run: |
          echo "APK generati:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: FrontlineCommander-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
