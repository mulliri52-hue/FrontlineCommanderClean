name: APK completo

on:
  workflow_dispatch:
  push:
    branches:
      - principale

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Estrai il progetto Android
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          echo "Contenuto dello ZIP:"
          unzip -l FrontlineCommander_FIXED.zip | head -50

          echo "Estrazione..."
          unzip -q FrontlineCommander_FIXED.zip -d android-project

          echo "Progetto estratto:"
          find android-project -maxdepth 4 -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print

      - name: Trova il progetto Gradle
        shell: bash
        run: |
          set -e

          GRADLEW=$(find android-project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERRORE: gradlew non trovato."
            echo "Contenuto estratto:"
            find android-project -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "gradlew trovato in: $GRADLEW"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configura Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --version

      - name: Compila APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Trova APK generato
        shell: bash
        run: |
          echo "APK trovati:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: FrontlineCommander-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
