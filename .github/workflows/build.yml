name: APK completo

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principale

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Estrai il progetto Android
        shell: bash
        run: |
          set -e

          ZIP="FrontlineCommander_FIXED.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRORE: $ZIP non trovato."
            echo "File presenti:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP" -d android-project

          echo "Progetto estratto correttamente."

      - name: Trova il progetto Gradle
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/gradlew" ]; then
              PROJECT_DIR="$DIR"
              break
            fi

            if [ -f "$DIR/settings.gradle" ] || [ -f "$DIR/settings.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find android-project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradlew" \
          \) | sort)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRORE: progetto Gradle non trovato."
            find android-project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "Progetto trovato:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configura Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "ERRORE: gradlew non trovato."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --version

      - name: Compila APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Trova APK generato
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR" -type f -name "*.apk" | head -1)"

          if [ -z "$APK" ]; then
            echo "ERRORE: nessun APK generato."
            exit 1
          fi

          echo "APK trovato:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp "$APK" "$GITHUB_WORKSPACE/apk/FrontlineCommander-debug.apk"

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: FrontlineCommander-APK
          path: apk/FrontlineCommander-debug.apk
          if-no-files-found: error
