name: APK completo

on:
  workflow_dispatch:
  push:
    branches:
      - principale

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Estrai il progetto Android
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q FrontlineCommander_FIXED.zip -d android-project

          echo "Contenuto estratto:"
          find android-project -maxdepth 4 -type f | head -100

      - name: Trova il progetto Gradle
        shell: bash
        run: |
          set -e

          GRADLEW=$(find android-project -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERRORE: gradlew non trovato."
            echo "Struttura del progetto estratto:"
            find android-project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle trovato in: $GRADLEW"
          echo "Progetto Android: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configura Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "Versione Gradle:"
          ./gradlew --version

      - name: Compila APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew --no-daemon assembleDebug

      - name: Trova APK generato
        shell: bash
        run: |
          set -e

          echo "APK generati:"
          find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/*.apk" -print

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: FrontlineCommander-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/*.apk
          if-no-files-found: error
