name: Frontline Commander - Crea APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Crea APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verifica Java
        shell: bash
        run: |
          set -e
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Installa Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Trova FRONTLINE_READY.zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 3 -type f -iname 'FRONTLINE_READY.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRORE: FRONTLINE_READY.zip non trovato."
            echo "File presenti:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ZIP trovato: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Estrai il progetto Android
        shell: bash
        run: |
          set -e

          rm -rf estratto
          mkdir -p estratto

          unzip -q "$ZIP" -d estratto

          echo "Contenuto estratto:"
          find estratto -maxdepth 4 -print

      - name: Trova il progetto Android
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE=$(find estratto -type f -name 'settings.gradle' -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            SETTINGS_FILE=$(find estratto -type f -name 'settings.gradle.kts' -print -quit)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRORE: progetto Android non trovato."
            echo "File Gradle trovati:"
            find estratto -type f -name 'settings.gradle' -print
            find estratto -type f -name 'settings.gradle.kts' -print
            exit 1
          fi

          echo "Progetto Android trovato: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Controlla la struttura del progetto
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERRORE: settings.gradle non trovato."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERRORE: build.gradle non trovato."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERRORE: app/build.gradle non trovato."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app/src/main" ]; then
            echo "ERRORE: app/src/main non trovato."
            exit 1
          fi

          echo "Struttura progetto OK."

      - name: Controlla Gradle Wrapper
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle Wrapper trovato."
            chmod +x "$PROJECT_DIR/gradlew"
            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"
          else
            echo "Gradle Wrapper non trovato."
            echo "Verrà utilizzato Gradle 8.11.1."
            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"
          fi

      - name: Compila APK Debug
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ "$USE_WRAPPER" = "true" ]; then
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          else
            gradle clean assembleDebug --no-daemon --stacktrace
          fi

      - name: Trova APK generato
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRORE: APK non generato."
            find "$PROJECT_DIR/app/build" -maxdepth 6 -type f -print || true
            exit 1
          fi

          echo "APK generato: $APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: FrontlineCommander-debug
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 7
