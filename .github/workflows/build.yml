name: Crea APK Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Compila APK
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Estrai il progetto Android
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRORE: non è stato trovato nessun file ZIP nella root del repository."
            exit 1
          fi

          echo "ZIP trovato: $ZIP_FILE"

          mkdir -p android_project
          unzip -o "$ZIP_FILE" -d android_project

          echo "Contenuto estratto:"
          find android_project -maxdepth 3 -type f | head -100

      - name: Trova il progetto Gradle
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find android_project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRORE: non è stato trovato un progetto Gradle Android."
            exit 1
          fi

          echo "Progetto Gradle trovato in: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configura JVM Java/Kotlin
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p .github

          cat > jvm-fix.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.matching { it.name.toLowerCase().contains("kotlin") }.configureEach {
                  try {
                      kotlinOptions.jvmTarget = "17"
                  } catch (Exception ignored) {
                  }
              }
          }
          EOF

          echo "JVM configurata su Java 17 / Kotlin 17"

      - name: Rendi eseguibile Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "ERRORE: gradlew non trovato."
            exit 1
          fi

      - name: Compila APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            -I jvm-fix.gradle \
            assembleDebug

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: FrontlineCommander-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
