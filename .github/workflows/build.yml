name: APK completo

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principale

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installa Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Estrai il progetto Android
        shell: bash
        run: |
          set -e
          rm -rf android-project
          mkdir -p android-project
          ZIP=""
          for f in FRONTLINE_READY.zip FRONTLINE_READY*.zip; do
            if [ -f "$f" ]; then ZIP="$f"; break; fi
          done
          if [ -z "$ZIP" ]; then
            echo "ERRORE: FRONTLINE_READY.zip non trovato."
            exit 1
          fi
          unzip -q "$ZIP" -d android-project
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts
          test -f android-project/app/src/main/java/com/frontline/commander/MainActivity.kt

      - name: Compila APK
        working-directory: android-project
        shell: bash
        run: |
          set -e
          gradle assembleDebug --no-daemon --stacktrace

      - name: Trova APK generato
        shell: bash
        run: |
          set -e
          APK="$(find android-project -type f -name '*.apk' -path '*/build/outputs/apk/*' | head -1)"
          if [ -z "$APK" ]; then
            echo "ERRORE: nessun APK generato."
            find android-project -type f -path '*/build/outputs/*' | sort || true
            exit 1
          fi
          mkdir -p apk
          cp "$APK" apk/FrontlineCommander-debug.apk

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: FrontlineCommander-APK
          path: apk/FrontlineCommander-debug.apk
          if-no-files-found: error
