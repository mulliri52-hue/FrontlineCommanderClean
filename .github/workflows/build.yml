name: APK completo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v5

      - name: Installa Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: ''

      - name: Estrai il progetto Android
        shell: bash
        run: |
          set -e

          ZIP="FRONTLINE_READY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRORE: $ZIP non trovato."
            echo "File presenti nel repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP" -d android-project

          echo "Progetto estratto correttamente."

      - name: Aggiorna Gradle a 8.13
        shell: bash
        run: |
          set -e

          WRAPPER="$(find android-project -type f -name "gradle-wrapper.properties" | head -1)"

          if [ -z "$WRAPPER" ]; then
            echo "ERRORE: gradle-wrapper.properties non trovato."
            find android-project -maxdepth 8 -type f | sort
            exit 1
          fi

          echo "Wrapper Gradle trovato:"
          echo "$WRAPPER"

          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip#' "$WRAPPER"

          echo "Nuova configurazione Gradle:"
          cat "$WRAPPER"

      - name: Trova il progetto Gradle
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          GRADLEW="$(find android-project -type f -name "gradlew" | head -1)"

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR="$(dirname "$GRADLEW")"
          else
            SETTINGS="$(find android-project -type f \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) | head -1)"

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRORE: progetto Gradle non trovato."
            find android-project -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "Progetto Gradle trovato:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configura Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "ERRORE: gradlew non trovato."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          chmod +x ./gradlew

          echo "Versione Gradle:"
          ./gradlew --version

      - name: Compila APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Trova APK generato
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)"

          if [ -z "$APK" ]; then
            echo "ERRORE: nessun APK generato."

            echo "File APK eventualmente presenti:"
            find "$PROJECT_DIR" -type f -name "*.apk" | sort

            exit 1
          fi

          echo "APK trovato:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK" "$GITHUB_WORKSPACE/apk/FRONTLINE-debug.apk"

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: FRONTLINE-APK
          path: apk/FRONTLINE-debug.apk
          if-no-files-found: error
