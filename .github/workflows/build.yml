name: Frontline Commander - Crea APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Crea APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Trova FRONTLINE_READY.zip
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 3 -type f -iname 'FRONTLINE_READY.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERRORE: FRONTLINE_READY.zip non trovato."
            exit 1
          fi

          echo "ZIP trovato: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Estrai progetto
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Trova progetto Android
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find extracted -type f \
            -name 'settings.gradle' \
            -o \
            -name 'settings.gradle.kts' \
          -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRORE: settings.gradle non trovato."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Progetto:"
          echo "$PROJECT_DIR"

      - name: Controllo struttura
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle" \
            || test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" \
            || test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -d "$PROJECT_DIR/app/src/main"

          echo "Struttura OK."

      - name: Controlla configurazione Android
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERRORE: app/build.gradle.kts non trovato."
            exit 1
          fi

          python3 - "$APP_GRADLE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          # compileSdk 36
          text = re.sub(
              r'(\bcompileSdk(?:Version)?\s*=\s*)\d+',
              r'\g<1>36',
              text
          )

          text = re.sub(
              r'(\bcompileSdk\s*\s*)\d+(\s*)',
              r'\g<1>36\g<2>',
              text
          )

          # Rimuove vecchio kotlinOptions
          text = re.sub(
              r'\n[ \t]*kotlinOptions[ \t]*\{.*?\n[ \t]*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # Rimuove vecchio jvmTarget String
          text = re.sub(
              r'(?m)^[ \t]*jvmTarget[ \t]*=[ \t]*["\']17["\'][ \t]*\r?\n',
              '',
              text
          )

          # Aggiunge compilerOptions moderna
          compiler = """k
