name: APK completo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Estrai il progetto Android
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERRORE: nessun file ZIP trovato nel repository."
            exit 1
          fi
          echo "ZIP trovato: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Trova il progetto Gradle
        id: project
        shell: bash
        run: |
          set -e
          GRADLEW="$(find extracted -type f -name 'gradlew' | head -n 1)"
          if [ -z "$GRADLEW" ]; then
            echo "ERRORE: gradlew non trovato nel progetto estratto."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "Progetto trovato in: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepara Gradle Wrapper
        shell: bash
        run: |
          chmod +x "${{ steps.project.outputs.project_dir }}/gradlew"

      - name: Compila APK Debug
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Trova APK generato
        id: apk
        shell: bash
        run: |
          set -e
          APK="$(find "${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERRORE: compilazione riuscita ma APK non trovato."
            find "${{ steps.project.outputs.project_dir }}/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi
          echo "APK trovato: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: FrontlineCommander-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 7
